[env:nano_r4]
platform = renesas-ra
board = nano_r4
framework = arduino
monitor_speed = 115200

; Keep this value synchronized with Raspberry PI 5/config/automaton.toml.
; It remains a software configuration choice, not a frozen hardware constant.
build_flags =
    -DAUTOMATON_CAN_BITRATE=500000UL
    -DAUTOMATON_PHYSICAL_SERVO_OUTPUTS_ENABLED=0
    -DAUTOMATON_HARDWARE_WATCHDOG_ENABLED=0
