[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automaton-host"
version = "0.3.0"
description = "Raspberry Pi control-plane software for the Automaton robotics project"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "gpiozero>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
automaton-host = "automaton.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automaton*"]
