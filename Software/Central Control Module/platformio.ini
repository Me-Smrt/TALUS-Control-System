[env:nano_r4]
platform = renesas-ra
board = nano_r4
framework = arduino
monitor_speed = 115200

; Development safety locks. CAN transceiver channel enables are intentionally allowed;
; high-current remote power and GLOBAL_SERVO_ALLOW remain physically unreachable in software.
build_flags =
    -DAUTOMATON_CCB_GLOBAL_SERVO_ALLOW_OUTPUT_ENABLED=0
    -DAUTOMATON_CCB_REMOTE_POWER_OUTPUTS_ENABLED=0
    -DAUTOMATON_CCB_CAN_CHANNEL_ENABLE_OUTPUTS_ENABLED=1
